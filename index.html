<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico">
<title>Kilu's Plst Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── PATTERN LOCK ── -->
<div id="lock">
  <div id="lock-box" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <span id="lock-icon">▦</span>
    <h2 id="lock-title">Locked</h2>
    <p id="lock-sub">Draw your pattern to unlock</p>

    <div id="pattern"
         role="application"
         aria-label="Pattern lock. Drag across the dots, or press keys 1 to 9, Backspace to undo, Enter to submit.">
      <svg id="pattern-svg" viewBox="0 0 300 300" aria-hidden="true">
        <polyline id="pattern-trail" points=""></polyline>
        <line id="pattern-live" x1="0" y1="0" x2="0" y2="0"></line>
      </svg>
      <div id="pattern-dots">
        <button type="button" class="dot" data-n="1" aria-label="Dot 1"><i></i></button>
        <button type="button" class="dot" data-n="2" aria-label="Dot 2"><i></i></button>
        <button type="button" class="dot" data-n="3" aria-label="Dot 3"><i></i></button>
        <button type="button" class="dot" data-n="4" aria-label="Dot 4"><i></i></button>
        <button type="button" class="dot" data-n="5" aria-label="Dot 5"><i></i></button>
        <button type="button" class="dot" data-n="6" aria-label="Dot 6"><i></i></button>
        <button type="button" class="dot" data-n="7" aria-label="Dot 7"><i></i></button>
        <button type="button" class="dot" data-n="8" aria-label="Dot 8"><i></i></button>
        <button type="button" class="dot" data-n="9" aria-label="Dot 9"><i></i></button>
      </div>
    </div>

    <p id="lock-status" role="status" aria-live="polite"></p>
    <p id="lock-legal">
      <strong>18+ only.</strong> This site contains explicit adult content. Unlocking confirms
      you are of legal age in your jurisdiction and accept responsibility for local laws.
    </p>
  </div>
</div>

<!-- ── BACKDROP (mobile drawer) ── -->
<div id="drawer-backdrop"></div>

<!-- ── SIDEBAR ── -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>▶ Kilu's Player</h1>
    <select id="playlistSelect"></select>
    <div id="controls-row">
      <button class="toggle-btn" id="shuffleBtn">⇄ Shuffle</button>
      <button class="toggle-btn active" id="autoBtn">↻ Auto</button>
    </div>
    <div id="open-row">
      <button class="toggle-btn" id="openLocalBtn">📂 Open File</button>
      <button class="toggle-btn" id="openUrlBtn">☁ From URL</button>
      <input type="file" id="fileInput" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl" hidden>
    </div>
    <div id="util-row">
      <button class="toggle-btn" id="densityBtn">▤ Compact</button>
      <button class="toggle-btn" id="cleanBtn">🧹 Clean</button>
      <button class="toggle-btn" id="lockBtn" title="Lock the player (L)">🔒 Lock</button>
      <button class="toggle-btn" id="exportBtn" title="Download this playlist as .m3u">⤓ Export</button>
    </div>
  </div>
  <div id="stats"></div>
  <div id="list-wrap"><div id="list"></div></div>
</div>

<!-- ── PLAYER ── -->
<div id="player">
  <div id="video-wrap">
    <div id="ambient"></div>
    <video id="video" autoplay playsinline></video>
    <div id="loader"><div class="loader-ring"></div></div>
  </div>
  <div id="info-bar">
    <span id="now-playing-label">Now Playing</span>
    <span id="now-playing-title">—</span>
    <div id="progress-wrap">
      <div id="progress-bar-bg">
        <div id="progress-bar-fill"></div>
      </div>
      <div id="time-info">
        <span id="time-cur">0:00</span>
        <span id="time-dur">0:00</span>
      </div>
    </div>
    <button class="nav-btn" id="prevBtn" title="Previous">
      <svg viewBox="0 0 16 16"><path d="M2 2h2v12H2zm3 6l9-6v12z"/></svg>
    </button>
    <button class="nav-btn" id="playBtn" title="Play/Pause">
      <svg viewBox="0 0 16 16">
        <path d="M2 2h4v12H2zm8 0h4v12h-4"/>
      </svg>
    </button>
    <button class="nav-btn" id="nextBtn" title="Next">
      <svg viewBox="0 0 16 16"><path d="M12 2h2v12h-2zm-1 6L2 2v12z"/></svg>
    </button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="1" title="Volume">
    <span id="index-badge"></span>
  </div>
</div>

<!-- ── Mobile playlist drawer toggle ── -->
<button id="drawer-toggle">☰ Playlist</button>

<!-- ── Toast notifications ── -->
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
